###########
## INPUT ##
###########

# Wiki: https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs

input {
    # --- TASTATUR (Norsk) ---
    kb_layout = no
    # Fjernet tomme linjer som kb_variant/options for å unngå syntax-feil

    # --- MUS & GAMING ---
    follow_mouse = 1

    # Sensitivity 0 = Bruk musas egen DPI (Best for gaming)
    sensitivity = 0

    # 'flat' profil fjerner akselerasjon (Raw Input)
    accel_profile = flat

    # force_no_accel er utdatert og fjernet her for å unngå konflikt

    # --- ANNET ---
    numlock_by_default = true

    touchpad {
        natural_scroll = true
    }
}

